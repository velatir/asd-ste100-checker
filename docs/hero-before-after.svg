<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">STE before and after - deploy docs</title>
  <desc id="desc">Left: dense deployment prose with STE rule findings. Right: short imperative steps, compliant-style.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #f7f8fa; }
      .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; }
      .label-bad { fill: #9a3412; }
      .label-good { fill: #166534; }
      .body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #1f2328; }
      .body-sm { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
      .muted { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #656d76; }
      .chip-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: #ffffff; font-weight: 600; }
      .footer { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #656d76; }
      .arrow { fill: #57606a; }
    ]]></style>
  </defs>

  <rect class="bg" width="1200" height="560" rx="12"/>

  <rect class="panel" x="36" y="36" width="520" height="460" rx="8"/>
  <rect x="36" y="36" width="6" height="460" rx="3" fill="#cf222e"/>
  <text class="label label-bad" x="60" y="68">BEFORE</text>
  <text class="muted" x="140" y="68">dense deploy prose</text>

  <text class="body-sm" x="56" y="108">
    <tspan x="56" dy="0">Three viable paths, in order of robustness, can be</tspan>
    <tspan x="56" dy="22">leveraged to facilitate deployment: implement</tspan>
    <tspan x="56" dy="22">containerized delivery so CI builds and pushes an</tspan>
    <tspan x="56" dy="22">image and the runtime pulls it; restore the pre-built</tspan>
    <tspan x="56" dy="22">environment and align infrastructure with the</tspan>
    <tspan x="56" dy="22">pipeline; or at minimum ensure that templates are</tspan>
    <tspan x="56" dy="22">synchronized and readiness is polled rather than slept.</tspan>
  </text>

  <g transform="translate(56, 330)">
    <rect width="188" height="26" rx="4" fill="#cf222e"/>
    <text class="chip-text" x="10" y="17">STE-VOCAB-UNAPPROVED</text>
  </g>
  <g transform="translate(256, 330)">
    <rect width="178" height="26" rx="4" fill="#cf222e"/>
    <text class="chip-text" x="10" y="17">STE-SENTENCE-LENGTH</text>
  </g>
  <g transform="translate(56, 370)">
    <rect width="118" height="26" rx="4" fill="#cf222e"/>
    <text class="chip-text" x="10" y="17">STE-PASSIVE</text>
  </g>
  <text class="muted" x="56" y="430">ste100 check · procedure · non-compliant</text>

  <path class="arrow" d="M570 250 L618 250 L618 238 L646 262 L618 286 L618 274 L570 274 Z"/>

  <rect class="panel" x="660" y="36" width="504" height="460" rx="8"/>
  <rect x="660" y="36" width="6" height="460" rx="3" fill="#1a7f37"/>
  <text class="label label-good" x="684" y="68">AFTER</text>
  <text class="muted" x="760" y="68">short imperative steps</text>

  <text class="body" x="680" y="118">Deploy the app with a container image.</text>
  <text class="body" x="680" y="156">1. Build the image in CI.</text>
  <text class="body" x="680" y="186">2. Push the image to the registry.</text>
  <text class="body" x="680" y="216">3. Configure the app to pull that image.</text>
  <text class="body" x="680" y="246">4. Do not install packages when the app starts.</text>

  <g transform="translate(680, 330)">
    <rect width="108" height="26" rx="4" fill="#1a7f37"/>
    <text class="chip-text" x="14" y="17">compliant</text>
  </g>
  <text class="muted" x="680" y="430">clear steps · one action each · short sentences</text>

  <text class="footer" x="600" y="532" text-anchor="middle">Unofficial · MCP for LLM agents</text>
</svg>
