name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run pytest
        run: pytest -q --cov=ste100 --cov-report=term-missing

      - name: Generate sample SARIF
        if: matrix.python-version == '3.12'
        run: |
          mkdir -p artifacts
          printf '%s\n' 'Utilize the system and commence the procedure.' \
            | ste100 check --output sarif > artifacts/sample.sarif || true

      - name: Upload SARIF artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ste100-sample-sarif
          path: artifacts/sample.sarif
          if-no-files-found: ignore
